<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Campus Lost & Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <main class="py-4">
    <div class="container" style="max-width: 820px;">
      
      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">Notifications</h2>
          <p class="text-muted small mb-0">Updates on smart matches, claim verifications, and item handovers</p>
        </div>
        <div>
          <button type="button" class="btn btn-outline-secondary btn-sm fw-semibold" id="mark-all-read-btn">
            <i class="bi bi-check2-all me-1"></i>Mark all as read
          </button>
        </div>
      </div>

      <!-- Notifications Card -->
      <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="list-group list-group-flush" id="notifications-list">
          <div class="p-5 text-center text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading notifications...
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>

  <script>
    async function loadNotifications() {
      const list = document.getElementById('notifications-list');
      try {
        const data = await API.notifications.list();
        const notifs = data.notifications || [];

        if (notifs.length === 0) {
          list.innerHTML = `
            <div class="p-5 text-center text-muted">
              <i class="bi bi-bell-slash fs-1 d-block mb-2 text-secondary"></i>
              No notifications yet. You'll receive alerts when potential matches or claims appear!
            </div>
          `;
          return;
        }

        list.innerHTML = notifs.map(n => {
          const isUnread = !n.is_read;
          let icon = 'bi-bell-fill text-primary';
          if (n.message.includes('Smart Match')) icon = 'bi-stars text-warning';
          if (n.message.includes('Claim Received')) icon = 'bi-person-check text-info';
          if (n.message.includes('APPROVED')) icon = 'bi-check-circle-fill text-success';
          if (n.message.includes('REJECTED')) icon = 'bi-x-circle-fill text-danger';

          return `
            <div class="list-group-item p-3 ${isUnread ? 'bg-primary-subtle bg-opacity-25' : ''} d-flex align-items-start gap-3">
              <div class="rounded-circle bg-white p-2 border shadow-sm d-flex align-items-center justify-content-center" style="width: 42px; height: 42px; min-width: 42px;">
                <i class="bi ${icon} fs-5"></i>
              </div>
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span class="small text-muted"><i class="bi bi-clock me-1"></i>${formatDate(n.created_at)}</span>
                  ${isUnread ? '<span class="badge bg-primary rounded-pill small">New</span>' : ''}
                </div>
                <div class="text-dark ${isUnread ? 'fw-bold' : ''} mb-2">
                  ${escapeHTML(n.message)}
                </div>
                <div class="d-flex gap-2 align-items-center">
                  ${n.link ? `
                    <a href="${escapeHTML(n.link)}" class="btn btn-sm btn-primary py-1 px-3 fw-semibold" onclick="markReadAndNav(${n.id})">
                      View Item <i class="bi bi-arrow-right"></i>
                    </a>
                  ` : ''}
                  ${isUnread ? `
                    <button class="btn btn-sm btn-outline-secondary py-1" onclick="markSingleRead(${n.id})">
                      Mark as read
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        showToast('Please sign in to view notifications.', 'warning');
        setTimeout(() => {
          window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.pathname)}`;
        }, 600);
      }
    }

    async function markSingleRead(id) {
      try {
        await API.notifications.markRead(id);
        loadNotifications();
        updateNavAuth();
      } catch (err) {
        showToast(err.message || 'Action failed.', 'danger');
      }
    }

    async function markReadAndNav(id) {
      try {
        await API.notifications.markRead(id);
      } catch (e) {
        // Continue navigation
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadNotifications();

      document.getElementById('mark-all-read-btn').addEventListener('click', async () => {
        try {
          await API.notifications.markAllRead();
          showToast('All notifications marked as read.', 'success');
          loadNotifications();
          updateNavAuth();
        } catch (err) {
          showToast(err.message || 'Action failed.', 'danger');
        }
      });
    });
  </script>
</body>
</html>
