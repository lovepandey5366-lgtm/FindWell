<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | Campus Lost & Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
                  <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">Create Campus Account</h3>
                <p class="text-muted small">Join your campus community to report and recover lost belongings</p>
              </div>

              <div id="reg-alert" class="alert d-none" role="alert"></div>

              <form id="register-form">
                <div class="mb-3">
                  <label for="name" class="form-label small fw-semibold">Full Name *</label>
                  <input type="text" class="form-control" id="name" placeholder="e.g. Maya Sharma" required minlength="2">
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-7">
                    <label for="email" class="form-label small fw-semibold">Campus Email Address *</label>
                    <input type="email" class="form-control" id="email" placeholder="name@campus.edu" required autocomplete="email">
                  </div>
                  <div class="col-md-5">
                    <label for="role_type" class="form-label small fw-semibold">Campus Role *</label>
                    <select class="form-select" id="role_type" required>
                      <option value="student" selected>Student</option>
                      <option value="faculty">Faculty</option>
                      <option value="staff">Staff / Admin</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="phone" class="form-label small fw-semibold">Phone Number (Optional)</label>
                  <input type="tel" class="form-control" id="phone" placeholder="e.g. 9876543210" pattern="[0-9+\-\s]{7,20}">
                  <div class="form-text small">Used only if you select phone contact preference for your items.</div>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label for="password" class="form-label small fw-semibold">Password *</label>
                    <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                  </div>
                  <div class="col-md-6">
                    <label for="confirm_password" class="form-label small fw-semibold">Confirm Password *</label>
                    <input type="password" class="form-control" id="confirm_password" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold mb-3" id="submit-btn">
                  Complete Registration
                </button>
              </form>

              <div class="text-center pt-2 border-top">
                <span class="small text-muted">Already have an account? </span>
                <a href="/login.html" class="small fw-semibold text-primary text-decoration-none">Sign in here</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('reg-alert');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'alert d-none';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const role_type = document.getElementById('role_type').value;
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        if (password !== confirm_password) {
          alertBox.className = 'alert alert-danger py-2 small';
          alertBox.textContent = 'Passwords do not match. Please verify and re-type.';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        try {
          await API.auth.register({
            name,
            email,
            phone,
            role_type,
            password
          });

          showToast('Account registered successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 600);
        } catch (err) {
          alertBox.className = 'alert alert-danger py-2 small';
          alertBox.textContent = err.message || 'Registration failed. Please try again.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Complete Registration';
        }
      });
    });
  </script>
</body>
</html>
