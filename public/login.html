<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Campus Lost & Found</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
                  <i class="bi bi-box-arrow-in-right fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to manage your campus reports and claims</p>
              </div>

              <!-- Alert Box -->
              <div id="login-alert" class="alert d-none" role="alert"></div>

              <form id="login-form">
                <div class="mb-3">
                  <label for="email" class="form-label small fw-semibold">Campus Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="name@campus.edu" required autocomplete="email">
                  </div>
                </div>

                <div class="mb-4">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                  </div>
                  <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary border-start-0" type="button" id="toggle-password">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold mb-3" id="submit-btn">
                  Sign In
                </button>
              </form>

              <!-- Quick Demo Fill Section -->
              <div class="border-top pt-3 mt-3">
                <div class="small fw-semibold text-muted mb-2 text-center">Click for One-Click Demo Credentials:</div>
                <div class="d-flex flex-wrap gap-2 justify-content-center">
                  <button type="button" class="btn btn-sm btn-outline-danger demo-btn" data-email="admin@campus.edu" data-pass="Admin@123">
                    <i class="bi bi-shield-lock me-1"></i>Admin
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-primary demo-btn" data-email="student@campus.edu" data-pass="User@123">
                    <i class="bi bi-mortarboard me-1"></i>Student (Alex)
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-success demo-btn" data-email="faculty@campus.edu" data-pass="User@123">
                    <i class="bi bi-person-video3 me-1"></i>Faculty (Dr. Sarah)
                  </button>
                </div>
              </div>

              <div class="text-center mt-4 pt-2 border-top">
                <span class="small text-muted">Don't have an account yet? </span>
                <a href="/register.html" class="small fw-semibold text-primary text-decoration-none">Register here</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('login-alert');

      // Password visibility toggle
      document.getElementById('toggle-password').addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
      });

      // Quick demo auto-fill
      document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          emailInput.value = btn.dataset.email;
          passwordInput.value = btn.dataset.pass;
          alertBox.className = 'alert alert-info py-2 small';
          alertBox.textContent = `Auto-filled credentials for ${btn.dataset.email}. Click Sign In!`;
        });
      });

      // Form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'alert d-none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

        try {
          const res = await API.auth.login({
            email: emailInput.value.trim(),
            password: passwordInput.value
          });

          showToast('Signed in successfully! Redirecting...', 'success');

          // Check redirect url in query params
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');

          setTimeout(() => {
            if (redirect) {
              window.location.href = redirect;
            } else if (res.user && res.user.is_admin) {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 600);
        } catch (err) {
          alertBox.className = 'alert alert-danger py-2 small';
          alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
